<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found &middot; Robert Hickey</title>
  <meta name="theme-color" content="#030805" />
  <script>
    try {
      if (localStorage.getItem("rh-mode") === "plain") {
        document.documentElement.setAttribute("data-theme", "plain");
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute("content", "#f7f8f7");
      }
    } catch (e) {}
  </script>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .nf { min-height: 80vh; display: flex; align-items: center; }
    .nf .container { max-width: 640px; }
    .nf h1 { color: var(--accent); font-size: clamp(2.5rem, 10vw, 5rem); margin: 0 0 0.5rem; text-shadow: var(--glow-text); }
    .nf pre { color: var(--dim); font-size: 0.9rem; white-space: pre-wrap; margin: 0 0 1.5rem; }
  </style>
</head>
<body>

</html>
